version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: nor-ai-db
    environment:
      POSTGRES_USER: nor
      POSTGRES_PASSWORD: nor_dev_password
      POSTGRES_DB: nor_ai_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
